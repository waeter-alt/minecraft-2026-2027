[General]
ConfigVersion=1.2
InstanceType=OneSix
name=L'Interrègne
iconKey=default
OverrideCommands=true
PreLaunchCommand="\"$INST_JAVA\" -jar packwiz-installer-bootstrap.jar PACK_URL"
WrapperCommand=
PostExitCommand=
OverrideMemory=true
MinMemAlloc=2048
MaxMemAlloc=6144
PermGen=128
OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=100 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=20 -XX:G1ReservePercent=20 -XX:G1HeapRegionSize=32M -Dfile.encoding=UTF-8
OverrideConsole=true
ShowConsole=false
AutoCloseConsole=true
ShowConsoleOnError=true
JoinServerOnLaunch=true
JoinServerOnLaunchAddress=SERVER_ADDRESS
