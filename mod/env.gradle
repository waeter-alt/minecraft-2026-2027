// Environnement de dev partagé : tout ce qu'un contributeur doit avoir pour travailler comme Duncan,
// reconstruit depuis le repo par UNE commande :  ./gradlew syncEnv
//
// Source de vérité (versionnée, dans mod/env/) :
//   env/mods.txt     mods installés dans run/client/mods et run/server/mods (téléchargés + hash vérifié)
//   env/config/      configs de référence copiées dans run/client/config
//   env/options.txt  options du client, copiées seulement si absentes (chacun garde son GUI scale ensuite)
//   env/saves.json   mondes de test, hébergés dans la release GitHub « env-saves » (hash vérifié)
//
// Tâches :
//   syncEnv        met tout à jour (écrase les configs modifiées localement, après sauvegarde)
//   checkEnv       détecte ce qui n'existe que sur cette machine (échoue si un mod n'est pas déclaré)
//   captureConfig  copie les configs locales dans env/config pour les versionner
//   publishSave    zippe un monde local, l'envoie en release GitHub et met à jour env/saves.json
// runClient et runServer lancent automatiquement une synchro douce (rien d'écrasé de ce que tu as modifié).
//
// Incompatible avec le configuration cache (accès fichiers/réseau à l'exécution) : c'est voulu, c'est un outil de dev.

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

def repoRoot = projectDir.parentFile
def envDir = file('env')
def runDir = file('run')
def cacheDir = new File(runDir, '.env-cache')
def stateFile = new File(runDir, '.env-state.json')
def modDirs = [client: new File(runDir, 'client/mods'), server: new File(runDir, 'server/mods')]
def cfgSrc = new File(envDir, 'config')
def cfgDest = new File(runDir, 'client/config')
def savesDir = new File(runDir, 'client/saves')
def savesManifest = new File(envDir, 'saves.json')
def releaseTag = 'env-saves'
def isIgnoredConfig = { String name -> name.contains('.bak') || name.endsWith('.avant-tests') }

def digest = { File f, String algo ->
    def md = MessageDigest.getInstance(algo.toUpperCase().startsWith('SHA-') ? algo.toUpperCase() : algo.toUpperCase().replace('SHA', 'SHA-'))
    f.withInputStream { is ->
        byte[] buf = new byte[65536]
        int n
        while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
    }
    md.digest().encodeHex().toString()
}

def download = { String url, File dest ->
    dest.parentFile.mkdirs()
    def tmp = new File(dest.parentFile, dest.name + '.part')
    for (int attempt = 1; ; attempt++) {
        try {
            def c = URI.create(url).toURL().openConnection()
            c.setRequestProperty('User-Agent', 'interregne-env-sync')
            c.connectTimeout = 20000
            c.readTimeout = 60000
            c.inputStream.withStream { is -> tmp.withOutputStream { os -> os << is } }
            break
        } catch (IOException e) {
            if (attempt >= 3) throw new GradleException("Téléchargement impossible : ${url} (${e.message})")
            sleep(2000)
        }
    }
    Files.move(tmp.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING)
}

// Lit le [download] d'une entrée packwiz : filename, url, hash-format, hash.
def parsePw = { File f ->
    def m = [:]
    def section = ''
    f.eachLine('UTF-8') { line ->
        def l = line.trim()
        if (l.startsWith('[')) { section = l; return }
        def mt = l =~ /^([\w-]+)\s*=\s*"(.*)"$/
        if (!mt) return
        if (section == '' && mt[0][1] == 'filename') m.filename = mt[0][2]
        if (section == '[download]') m[mt[0][1]] = mt[0][2]
    }
    m
}

def readMods = {
    def out = []
    new File(envDir, 'mods.txt').eachLine('UTF-8') { raw ->
        def l = raw.replaceAll(/#.*/, '').trim()
        if (!l) return
        def parts = l.split(/\s+/, 2)
        if (parts.length < 2 || !(parts[0] in ['client', 'server', 'both'])) throw new GradleException("env/mods.txt : ligne invalide « ${raw} »")
        def targets = parts[0] == 'both' ? ['client', 'server'] : [parts[0]]
        def src = parts[1]
        if (src.startsWith('local:')) {
            def f = new File(repoRoot, src.substring(6))
            if (!f.exists()) throw new GradleException("env/mods.txt : fichier introuvable « ${src} »")
            out << [targets: targets, name: f.name, local: f, source: src]
        } else {
            def pw = new File(repoRoot, "launcher/pack/mods/${src}.pw.toml")
            if (!pw.exists()) throw new GradleException("env/mods.txt : pas d'entrée launcher/pack/mods/${src}.pw.toml")
            def p = parsePw(pw)
            if (!p.url) throw new GradleException("env/mods.txt : « ${src} » n'a pas d'URL directe (mod CurseForge). Mets son jar dans mod/libs et déclare-le avec local:")
            out << [targets: targets, name: p.filename, url: p.url, algo: p['hash-format'], hash: p.hash, source: src]
        }
    }
    out
}

def matches = { Map e, File f ->
    e.local ? digest(f, 'SHA-256') == digest(e.local, 'SHA-256') : digest(f, e.algo) == e.hash
}

def ensureCached = { Map e ->
    if (e.local) return e.local
    def cached = new File(cacheDir, "mods/${e.name}")
    if (!cached.exists() || !matches(e, cached)) {
        println "  ↓ ${e.name}"
        download(e.url, cached)
        if (!matches(e, cached)) {
            cached.delete()
            throw new GradleException("Hash incorrect pour ${e.name} : le fichier téléchargé ne correspond pas à launcher/pack/mods/${e.source}.pw.toml")
        }
    }
    cached
}

def loadState = {
    def s = stateFile.exists() ? new JsonSlurper().parse(stateFile) : [:]
    [mods: s.mods ?: [:], config: s.config ?: [:], saves: s.saves ?: [:]]
}
def saveState = { Map s -> stateFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(s)) }

def readSaves = { savesManifest.exists() ? (new JsonSlurper().parse(savesManifest).saves ?: []) : [] }

def syncMods = { Map state, boolean removeUnknown ->
    def entries = readMods()
    def wanted = [client: [] as Set, server: [] as Set]
    entries.each { e -> e.targets.each { wanted[it] << e.name } }
    entries.each { e ->
        def src = null
        e.targets.each { t ->
            def dest = new File(modDirs[t], e.name)
            if (dest.exists() && matches(e, dest)) return
            if (src == null) src = ensureCached(e)
            modDirs[t].mkdirs()
            Files.copy(src.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println "  + ${t}/mods/${e.name}"
        }
    }
    state.mods.each { t, names ->
        names.each { n ->
            if (wanted[t] != null && !(n in wanted[t]) && new File(modDirs[t], n).delete()) println "  - ${t}/mods/${n} (plus déclaré)"
        }
    }
    state.mods = wanted.collectEntries { t, s -> [t, s.toList().sort()] }
    def unknown = []
    modDirs.each { t, d ->
        d.listFiles()?.each { f ->
            if (f.name.endsWith('.jar') && !(f.name in wanted[t])) {
                if (removeUnknown && f.delete()) println "  - ${t}/mods/${f.name} (non déclaré)"
                else unknown << "${t}/mods/${f.name}"
            }
        }
    }
    unknown
}

def syncConfig = { Map state, boolean force ->
    def stamp = new Date().format('yyyyMMdd-HHmmss')
    int updated = 0
    def kept = []
    if (cfgSrc.exists()) {
        cfgSrc.eachFileRecurse(groovy.io.FileType.FILES) { src ->
            def rel = cfgSrc.toPath().relativize(src.toPath()).toString().replace('\\', '/')
            def dest = new File(cfgDest, rel)
            def want = digest(src, 'SHA-256')
            if (!dest.exists()) {
                dest.parentFile.mkdirs()
                Files.copy(src.toPath(), dest.toPath())
                state.config[rel] = want
                updated++
                return
            }
            def have = digest(dest, 'SHA-256')
            if (have == want) { state.config[rel] = want; return }
            boolean untouched = state.config[rel] == have   // pas modifié depuis la dernière synchro
            if (untouched || force) {
                if (!untouched) {
                    def bak = new File(runDir, "client/config-backup/${stamp}/${rel}")
                    bak.parentFile.mkdirs()
                    Files.copy(dest.toPath(), bak.toPath())
                }
                Files.copy(src.toPath(), dest.toPath(), StandardCopyOption.REPLACE_EXISTING)
                state.config[rel] = want
                updated++
            } else {
                kept << rel
            }
        }
    }
    def opt = new File(envDir, 'options.txt')
    def optDest = new File(runDir, 'client/options.txt')
    if (opt.exists() && !optDest.exists()) {
        optDest.parentFile.mkdirs()
        Files.copy(opt.toPath(), optDest.toPath())
        println '  + options.txt'
    }
    [updated, kept]
}

def installSave = { Map s ->
    def zip = new File(cacheDir, "saves/${s.sha256.take(12)}-${s.name.replaceAll(/[^A-Za-z0-9._-]/, '_')}.zip")
    if (!zip.exists() || digest(zip, 'SHA-256') != s.sha256) {
        println "  ↓ monde « ${s.name} » (${(s.size / 1048576) as int} Mo)"
        download(s.url, zip)
        if (digest(zip, 'SHA-256') != s.sha256) {
            zip.delete()
            throw new GradleException("Hash incorrect pour le monde « ${s.name} » (env/saves.json)")
        }
    }
    def tmp = new File(cacheDir, 'extract')
    delete(tmp)
    ant.unzip(src: zip, dest: tmp)
    def extracted = new File(tmp, s.name)
    if (!extracted.isDirectory()) throw new GradleException("L'archive du monde « ${s.name} » ne contient pas un dossier « ${s.name} »")
    savesDir.mkdirs()
    Files.move(extracted.toPath(), new File(savesDir, s.name).toPath())
    delete(tmp)
    println "  + monde « ${s.name} »"
}

def syncSaves = { Map state ->
    def reset = (project.findProperty('resetSave') ?: '').toString()
    def stale = []
    readSaves().each { s ->
        def dir = new File(savesDir, s.name)
        def recorded = state.saves[s.name]
        boolean resetThis = reset == 'all' || reset == s.name
        if (dir.exists() && resetThis) {
            def old = new File(runDir, "client/saves-old/${s.name}.${new Date().format('yyyyMMdd-HHmmss')}")
            old.parentFile.mkdirs()
            Files.move(dir.toPath(), old.toPath())
            println "  ~ ancien « ${s.name} » rangé dans run/client/saves-old/"
        }
        if (!dir.exists()) {
            installSave(s)
            state.saves[s.name] = s.sha256
        } else if (recorded && recorded != s.sha256) {
            stale << s.name
        }
    }
    stale
}

def runSync = { boolean force ->
    runDir.mkdirs()
    def state = loadState()
    println 'Environnement partagé : mods'
    def unknown = syncMods(state, project.hasProperty('removeUnknown'))
    println 'Environnement partagé : configs'
    def (updated, kept) = syncConfig(state, force)
    println 'Environnement partagé : mondes de test'
    def stale = syncSaves(state)
    saveState(state)
    println ''
    println "OK : mods à jour, ${updated} config(s) mise(s) à jour."
    if (kept) println "ATTENTION : ${kept.size()} config(s) modifiée(s) localement, gardée(s) telles quelles : ${kept.take(5).join(', ')}${kept.size() > 5 ? '…' : ''}\n  → ./gradlew syncEnv pour les remplacer (sauvegarde dans run/client/config-backup/)."
    if (stale) println "ATTENTION : monde(s) mis à jour dans le repo, ta copie est ancienne : ${stale.join(', ')}\n  → ./gradlew syncEnv -PresetSave=\"<nom>\" (ou all) ; l'ancienne copie est rangée dans run/client/saves-old/."
    if (unknown) println "ATTENTION : jar(s) non déclaré(s) dans env/mods.txt : ${unknown.join(', ')}\n  → les déclarer (voir CLAUDE.md) ou relancer avec -PremoveUnknown pour les supprimer."
}

tasks.register('syncEnv') {
    group = 'kodistan env'
    description = "Installe/met à jour mods, configs et mondes de test depuis le repo"
    notCompatibleWithConfigurationCache('synchronise des fichiers et télécharge à l\'exécution')
    doLast { runSync(true) }
}

tasks.register('syncEnvAuto') {
    group = 'kodistan env'
    description = 'Synchro douce lancée avant runClient/runServer (-PskipEnvSync pour la sauter)'
    notCompatibleWithConfigurationCache('synchronise des fichiers et télécharge à l\'exécution')
    onlyIf { !project.hasProperty('skipEnvSync') }
    doLast { runSync(false) }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { dependsOn 'syncEnvAuto' }

tasks.register('checkEnv') {
    group = 'kodistan env'
    description = "Détecte ce qui n'existe que sur cette machine (mods non déclarés, configs et mondes non versionnés)"
    notCompatibleWithConfigurationCache('lit des fichiers à l\'exécution')
    doLast {
        def problems = []
        def warnings = []
        def entries = readMods()
        def wanted = [client: [] as Set, server: [] as Set]
        entries.each { e ->
            e.targets.each { t ->
                wanted[t] << e.name
                def f = new File(modDirs[t], e.name)
                if (!f.exists()) problems << "mod déclaré mais absent : ${t}/mods/${e.name} (./gradlew syncEnv)"
                else if (!matches(e, f)) problems << "mod différent de la version déclarée : ${t}/mods/${e.name}"
            }
        }
        modDirs.each { t, d ->
            d.listFiles()?.each { f ->
                if (f.name.endsWith('.jar') && !(f.name in wanted[t])) problems << "mod présent localement mais NON déclaré : ${t}/mods/${f.name} → l'ajouter à env/mods.txt (et launcher/pack si c'est un mod tiers)"
            }
        }
        def drift = []
        def localOnly = []
        if (cfgDest.exists()) {
            cfgDest.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = cfgDest.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                if (isIgnoredConfig(f.name)) return
                def ref = new File(cfgSrc, rel)
                if (!ref.exists()) localOnly << rel
                else if (digest(ref, 'SHA-256') != digest(f, 'SHA-256')) drift << rel
            }
        }
        if (drift) warnings << "${drift.size()} config(s) modifiée(s) par rapport à env/config : ${drift.take(8).join(', ')}${drift.size() > 8 ? '…' : ''}"
        if (localOnly) warnings << "${localOnly.size()} fichier(s) de config locaux absents de env/config : ${localOnly.take(8).join(', ')}${localOnly.size() > 8 ? '…' : ''}"
        if (drift || localOnly) warnings << '→ si ces réglages comptent pour les tests : ./gradlew captureConfig puis commit de mod/env/config'
        def declared = readSaves().collect { it.name } as Set
        def localSaves = (savesDir.listFiles() ?: []).findAll { it.isDirectory() && !(it.name in declared) }*.name.sort()
        if (localSaves) warnings << "${localSaves.size()} monde(s) local(aux) non partagé(s) : ${localSaves.join(', ')}\n    → ceux dont un test dépend : ./gradlew publishSave -Psave=\"<nom>\" (les autres sont des brouillons, à ignorer)"
        println ''
        warnings.each { println "AVERTISSEMENT : ${it}" }
        if (problems) {
            problems.each { println "PROBLÈME : ${it}" }
            throw new GradleException("checkEnv : ${problems.size()} problème(s). L'environnement n'est pas reproductible chez les autres.")
        }
        println 'checkEnv : mods conformes à env/mods.txt.'
    }
}

tasks.register('captureConfig') {
    group = 'kodistan env'
    description = 'Copie les configs locales (run/client/config) dans env/config pour les versionner'
    notCompatibleWithConfigurationCache('copie des fichiers à l\'exécution')
    doLast {
        int n = 0
        cfgDest.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (isIgnoredConfig(f.name)) return
            def rel = cfgDest.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            def ref = new File(cfgSrc, rel)
            if (ref.exists() && digest(ref, 'SHA-256') == digest(f, 'SHA-256')) return
            def existed = ref.exists()
            ref.parentFile.mkdirs()
            Files.copy(f.toPath(), ref.toPath(), StandardCopyOption.REPLACE_EXISTING)
            println "  ${existed ? '~' : '+'} ${rel}"
            n++
        }
        println "captureConfig : ${n} fichier(s) copié(s) dans mod/env/config. Pense à les commiter."
    }
}

tasks.register('publishSave') {
    group = 'kodistan env'
    description = 'Zippe un monde de test, le publie en release GitHub « env-saves » et met à jour env/saves.json (-Psave="Nom" [-PsavesDir=...])'
    notCompatibleWithConfigurationCache('zippe et publie à l\'exécution')
    doLast {
        def name = project.findProperty('save')
        if (!name) throw new GradleException('Usage : ./gradlew publishSave -Psave="Nom du monde" [-PsavesDir=chemin/des/saves]')
        def base = project.findProperty('savesDir') ? new File(project.findProperty('savesDir').toString()) : savesDir
        def dir = new File(base, name.toString())
        if (!new File(dir, 'level.dat').exists()) throw new GradleException("« ${dir} » n'est pas un monde Minecraft (pas de level.dat). Ferme le jeu si le monde est ouvert.")
        def outDir = new File(projectDir, 'build/env')
        outDir.mkdirs()
        def tmp = new File(outDir, 'tmp.zip')
        tmp.delete()
        // include/exclude imbriqués : l'attribut includes d'Ant se découpe aux espaces et casse « Arene Hub »
        ant.zip(destfile: tmp) {
            zipfileset(dir: base) {
                include(name: "${name}/**")
                exclude(name: '**/session.lock')
            }
        }
        if (!tmp.exists()) throw new GradleException("Archive vide : rien à zipper pour « ${name} » dans ${base}")
        def sha = digest(tmp, 'SHA-256')
        def asset = "${name.toString().replaceAll(/[^A-Za-z0-9._-]/, '_')}-${sha.take(8)}.zip"
        def zip = new File(outDir, asset)
        Files.move(tmp.toPath(), zip.toPath(), StandardCopyOption.REPLACE_EXISTING)
        def sh = { List<String> cmd ->
            def p = new ProcessBuilder(cmd).directory(repoRoot).redirectErrorStream(true).start()
            def txt = p.inputStream.text
            [p.waitFor(), txt.trim()]
        }
        def (rc, out) = sh(['gh', 'release', 'view', releaseTag])
        if (rc != 0) {
            (rc, out) = sh(['gh', 'release', 'create', releaseTag, '--title', 'Mondes de test (environnement partagé)', '--notes', 'Archives des mondes de test. Gérées par ./gradlew publishSave et env/saves.json : ne pas modifier à la main.'])
            if (rc != 0) throw new GradleException("gh release create a échoué : ${out}")
        }
        (rc, out) = sh(['gh', 'release', 'upload', releaseTag, zip.absolutePath, '--clobber'])
        if (rc != 0) throw new GradleException("gh release upload a échoué : ${out}")
        (rc, out) = sh(['gh', 'repo', 'view', '--json', 'url', '-q', '.url'])
        if (rc != 0) throw new GradleException("gh repo view a échoué : ${out}")
        def url = "${out}/releases/download/${releaseTag}/${asset}"
        def saves = readSaves().findAll { it.name != name.toString() }
        saves << [name: name.toString(), url: url, sha256: sha, size: zip.length()]
        saves.sort { it.name }
        savesManifest.text = JsonOutput.prettyPrint(JsonOutput.toJson([saves: saves])) + '\n'
        println "Monde « ${name} » publié (${(zip.length() / 1048576) as int} Mo) : ${url}"
        println 'Commite mod/env/saves.json pour que les autres le reçoivent.'
    }
}
